#
# API-shape coverage analysis - offtake requirements vs. a provider's public API.
#
# This is a STATIC analysis: does the provider's API surface (paths + schemas)
# plausibly satisfy each offtake requirement, based on reading the OpenAPI spec
# alone? No live account, no test run. See ../README.md for methodology and
# limitations (structural presence != behavioral correctness).
#
# Per entry:
#   req_id   - matches docs/requirements/offtake-requirements.yaml
#   status   - present   | the API exposes a matching path/schema
#              partial   | some but not all of the requirement is covered
#              absent    | no matching surface found in the spec
#              not_applicable | the requirement isn't something API shape can
#                          confirm or deny (facility/compliance/policy prose,
#                          performance numbers, hardware attestation, etc.)
#   evidence - list of references into spec/lambda-cloud-openapi.json:
#              "METHOD /path" for an operation, "schema:Name" for a schema,
#              "schema:Name.field" for a specific field. Empty for absent/n-a.
#   notes    - why, in one line.

