#
# API-shape coverage analysis - offtake requirements vs. a provider's public API.
#
# This is a STATIC analysis: does the provider's API surface (paths + schemas)
# plausibly satisfy each offtake requirement, based on reading the OpenAPI spec
# alone? No live account, no test run. See ../README.md for methodology and
# limitations (structural presence != behavioral correctness).
#
# Per entry:
#   req_id   - matches docs/requirements/offtake-requirements.yaml
#   status   - present   | the API exposes a matching path/schema
#              partial   | some but not all of the requirement is covered
#              absent    | no matching surface found in the spec
#              not_applicable | the requirement isn't something API shape can
#                          confirm or deny (facility/compliance/policy prose,
#                          performance numbers, hardware attestation, etc.)
#   evidence - list of references into spec/mistral-compute-webui-openapi.json:
#              "METHOD /path" for an operation, "schema:Name" for a schema,
#              "schema:Name.field" for a specific field. Only schemas reachable
#              from an actual path are cited as evidence (see caveats - this
#              spec defines several orphaned/unwired schemas). Empty for
#              absent/n-a.
#   notes    - why, in one line.

provider: mistral
spec: specs/mistral-compute-webui-openapi.json
spec_source: openapi-mistral-compute-webui-jul17.pretty.json, supplied directly (no public URL - Mistral Compute is sales-gated/early-access, see caveats)
spec_title: Mistral Compute API 0.2.0 (webui export, 2026-07-17)
fetched: '2026-09-14'
caveats:
  - 'A second, narrower spec ("Compute API" 0.2.0, 24 paths, titled "REST API for Managed Kubernetes Service") was supplied first and is vendored alongside this one as specs/mistral-compute-openapi.json but NOT used for scoring - this richer 56-path spec was designated primary. Where they disagree (e.g. the narrower spec has real /v1/ssh-keys and /v1/quotas paths that are absent here), this file''s reachable surface is authoritative for this analysis, but the discrepancy itself suggests the two exports may be different API versions/audiences and should be reconciled with Mistral/NKX directly rather than treated as final.'
  - 'The filename indicates this is a "webui" export - i.e. plausibly the web console''s backend API surface rather than a published partner/public API spec. Treat findings as an approximation of Mistral Compute''s real capability, not a confirmed public contract.'
  - 'This spec defines 28 schemas that are never referenced by any path operation (unreachable via $ref from paths): SSOConnection/SSOEnableRequest/ SSOOnboardingLink (org SSO), MetricsExportConfig and friends (OTLP metrics export), Organization/OrganizationUpdate, the flat Member/MemberInvite/ MemberUpdate (superseded by ProjectMember), SSHKey/SSHKeyCreate, Quota, Permission/MyPermissions, and ProjectOAuth2Client*. Their presence strongly suggests these capabilities exist in the product (or are imminent), but per this tool''s methodology only operations reachable from a real path count as evidence - so requirements that would otherwise map to these (SEC01 SSO, SEC24 domain-based IdP routing, SEC26 SSO enforcement, K8S07 metrics) are scored absent here despite matching schemas existing. This likely UNDERSTATES Mistral''s real capability and is worth confirming directly.'
